name: Build Nova Portable
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: node --test tools/patch.test.mjs
      - run: npm install
      - run: node scripts/icon.mjs
      - run: npm run tauri build -- --no-bundle
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable/tools
          Copy-Item src-tauri/target/release/nova-launcher.exe portable/NovaLauncher.exe
          Copy-Item (Get-Command node.exe).Source portable/tools/node.exe
          Copy-Item tools/recompile.mjs,tools/patch.mjs,tools/NovaTheme.java portable/tools/
          Copy-Item README.md portable/
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-Portable-Windows
          path: portable/
          if-no-files-found: error
